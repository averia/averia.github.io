<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<LINK REL="SHORTCUT ICON" HREF="imatges/icon.ico">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>gb</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  #top {
    position: fixed;
    top: 0;
    left: 0;
    height: 45px;
    width: 100%;
    border: none;
    z-index: 10;
  }
  #main {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
  }
  @media only screen and (max-width: 650px) {
    #top { height: 110px; }
  }
</style>
</head>
<body>
  <iframe src="menu.html" name="top" id="top" title="topFrame" scrolling="no"></iframe>
  <iframe src="main.html" name="main" id="main" title="mainFrame"></iframe>

  <script type="text/javascript">
    (function() {
      const mainIframe = document.getElementById('main');
      const topIframe = document.getElementById('top');
      let projects = [];

      function updateProjectList() {
        try {
          const select = topIframe.contentDocument.getElementById('proyectos2');
          if (select) {
            projects = Array.from(select.options).map(opt => opt.value);
          }
        } catch (e) {
          // Cross-origin or not loaded yet
        }
      }

      function navigate(direction) {
        updateProjectList();
        if (projects.length === 0) return;

        try {
          const url = new URL(mainIframe.contentWindow.location.href);
          const path = url.pathname;
          
          // Extract relative path to match projects array (e.g., "proyectos/millis.html")
          const parts = path.split('/');
          const filename = parts.pop();
          const folder = parts.pop();
          
          let normalizedCurrent = folder === 'proyectos' ? 'proyectos/' + filename : filename;
          // Decode URL (e.g. %20 to space) for matching
          normalizedCurrent = decodeURIComponent(normalizedCurrent);
          
          let currentIndex = projects.indexOf(normalizedCurrent);
          
          if (currentIndex !== -1) {
            let nextIndex = currentIndex + direction;
            if (nextIndex >= 0 && nextIndex < projects.length) {
              const nextUrl = projects[nextIndex];
              mainIframe.src = nextUrl;
              
              // Sync the select menu in the top frame
              try {
                const select = topIframe.contentDocument.getElementById('proyectos2');
                if (select) {
                  select.value = nextUrl;
                }
              } catch (e) {}
            }
          }
        } catch (e) {
          console.error("Navigation error", e);
        }
      }

      let touchstartX = 0;
      let touchendX = 0;
      let touchstartY = 0;
      let touchendY = 0;

      function handleGesture() {
        const thresholdX = 80;
        const thresholdY = 50; // To avoid swiping when scrolling vertically
        
        const distX = touchendX - touchstartX;
        const distY = touchendY - touchstartY;

        if (Math.abs(distX) > thresholdX && Math.abs(distY) < thresholdY) {
          if (distX < 0) {
            // Swipe left -> Next
            navigate(1);
          } else {
            // Swipe right -> Prev
            navigate(-1);
          }
        }
      }

      mainIframe.addEventListener('load', function() {
        try {
          const doc = mainIframe.contentDocument || mainIframe.contentWindow.document;
          
          doc.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
          }, {passive: true});

          doc.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
          }, {passive: true});
        } catch (e) {
          // Might be cross-origin if external link is clicked (e.g. CV)
        }
      });
    })();
  </script>

</script>
</body>
