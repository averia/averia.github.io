        <p align="left" class="titulo"><strong>X-1</strong></p>
        <p align="left" class="texto">2008</p>
        <p align="left" class="texto">Reloj y electr&oacute;nica</p>
        <p align="left" class="texto">Reloj de pared intervenido asociado a un motor paso a paso.</p>

    <tr>
      <td align="center" valign="middle" bgcolor="#FFFFFF">
        <div style="display: flex; justify-content: center; align-items: center; width: 100%; padding: 20px 0;">
          <canvas id="relojInvertido" width="500" height="500"
            style="width: 400px; max-width: 100%; height: auto; display: block;"></canvas>
        </div>
        <script type="text/javascript">
          (function () {
            var canvas = document.getElementById('relojInvertido');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');

            var dpr = window.devicePixelRatio || 1;
            var displayWidth = 500;
            var displayHeight = 500;
            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;

            function drawClock() {
              var now = new Date();
              var sec = now.getSeconds() + now.getMilliseconds() / 1000;
              var min = now.getMinutes() + sec / 60;
              var hrs = (now.getHours() % 12) + min / 60;

              var faceAngle = -(sec / 60) * 2 * Math.PI;

              ctx.save();
              ctx.scale(dpr, dpr);
              ctx.clearRect(0, 0, displayWidth, displayHeight);

              var cx = displayWidth / 2;
              var cy = displayHeight / 2;
              var radius = 180;

              // 1. Draw Rotating Clock Face (Dial + Numbers + Ticks)
              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(faceAngle);

              // Dial Outer Border
              ctx.beginPath();
              ctx.arc(0, 0, radius, 0, 2 * Math.PI);
              ctx.lineWidth = 4;
              ctx.strokeStyle = '#222222';
              ctx.fillStyle = '#FFFFFF';
              ctx.fill();
              ctx.stroke();

              // Center pin background
              ctx.beginPath();
              ctx.arc(0, 0, 6, 0, 2 * Math.PI);
              ctx.fillStyle = '#222222';
              ctx.fill();

              // Hour numbers and ticks
              ctx.fillStyle = '#111111';
              ctx.font = 'bold 24px Arial, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';

              for (var num = 1; num <= 12; num++) {
                var angle = (num * 30 - 90) * Math.PI / 180;
                var tx = Math.cos(angle) * (radius - 32);
                var ty = Math.sin(angle) * (radius - 32);
                ctx.fillText(num.toString(), tx, ty);
              }

              // Ticks (60 ticks around face)
              for (var i = 0; i < 60; i++) {
                var angle = (i * 6 - 90) * Math.PI / 180;
                var isHour = (i % 5 === 0);
                var innerR = isHour ? radius - 15 : radius - 8;
                var outerR = radius - 4;

                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * innerR, Math.sin(angle) * innerR);
                ctx.lineTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
                ctx.lineWidth = isHour ? 2.5 : 1;
                ctx.strokeStyle = '#333333';
                ctx.stroke();
              }

              // Draw Hour Hand (rotates with face)
              ctx.save();
              var relativeHrsAngle = (hrs / 12) * 2 * Math.PI - Math.PI / 2;
              ctx.rotate(relativeHrsAngle);
              ctx.beginPath();
              ctx.moveTo(-4, 10);
              ctx.lineTo(-2, -100);
              ctx.lineTo(0, -110);
              ctx.lineTo(2, -100);
              ctx.lineTo(4, 10);
              ctx.closePath();
              ctx.fillStyle = '#222222';
              ctx.fill();
              ctx.restore();

              // Draw Minute Hand (rotates with face)
              ctx.save();
              var relativeMinAngle = (min / 60) * 2 * Math.PI - Math.PI / 2;
              ctx.rotate(relativeMinAngle);
              ctx.beginPath();
              ctx.moveTo(-3, 15);
              ctx.lineTo(-1.5, -145);
              ctx.lineTo(0, -155);
              ctx.lineTo(1.5, -145);
              ctx.lineTo(3, 15);
              ctx.closePath();
              ctx.fillStyle = '#222222';
              ctx.fill();
              ctx.restore();

              ctx.restore(); // Restore rotating face transform

              // 2. Draw FIXED SECOND POINTER (pointing straight UP at 12 o'clock)
              ctx.save();
              ctx.translate(cx, cy);
              ctx.beginPath();
              ctx.moveTo(0, 15);
              ctx.lineTo(0, -(radius - 12));
              ctx.lineWidth = 2;
              ctx.strokeStyle = '#D32F2F';
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(0, -(radius - 12), 4, 0, 2 * Math.PI);
              ctx.fillStyle = '#D32F2F';
              ctx.fill();

              ctx.beginPath();
              ctx.arc(0, 0, 4, 0, 2 * Math.PI);
              ctx.fillStyle = '#D32F2F';
              ctx.fill();
              ctx.restore();

              ctx.restore(); // Restore scale

              requestAnimationFrame(drawClock);
            }

            requestAnimationFrame(drawClock);
          })();
        </script>
