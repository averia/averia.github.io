<body>
<table border="0" align="center" bgcolor="#FFFFFF">
  <tr>
    <td align="center">
      <canvas id="hb" width="300" height="240" style="display:block;margin:0 auto;touch-action:manipulation" role="img" aria-label="Un coraz&oacute;n que late cuando el cursor pasa por encima"></canvas>
      <p class="Estilo1">Pasa el cursor sobre el coraz&oacute;n (o toca la pantalla).</p>
      <script type="text/javascript">
      (function () {
        var cv = document.getElementById('hb'), ctx = cv.getContext('2d');
        var W = cv.width, H = cv.height;
        var CX = 160, CY = 143, RX = 92, RY = 45;     // zona del corazón (px de la imagen)
        var PERIOD = 1.04;                             // duración del latido (s)
        var NF = 12, imgs = [], loaded = 0;
        for (var i = 1; i <= NF; i++) {
          var im = new Image();
          im.onload = function () { if (++loaded === NF) show(0); };
          im.src = '../imatges/hb/hb' + (i < 10 ? '0' : '') + i + '.jpg';
          imgs.push(im);
        }
        // Audio: se desbloquea con la primera interacción (clic, toque o tecla) en esta página
        // o en el menú/marco que la contiene, y a partir de entonces suena en cada latido.
        var AC = window.AudioContext || window.webkitAudioContext, actx = null, buf = null;
        var el = new Audio();
        el.src = el.canPlayType('audio/mpeg') ? '../imatges/hb/latido.mp3' : '../imatges/hb/latido.ogg';
        el.preload = 'auto';
        function unlock() {
          try {
            if (AC && !actx) {
              actx = new AC();
              fetch(el.src).then(function (r) { return r.arrayBuffer(); })
                .then(function (a) { return new Promise(function (ok, ko) { actx.decodeAudioData(a, ok, ko); }); })
                .then(function (b) { buf = b; }).catch(function () {});
            }
            if (actx && actx.state !== 'running') actx.resume();
            var p = el.play(); if (p && p.then) p.then(function () { el.pause(); el.currentTime = 0; }).catch(function () {});
          } catch (e) {}
        }
        var evs = ['pointerdown', 'mousedown', 'touchstart', 'touchend', 'click', 'keydown'];
        function listen(w) {
          try { evs.forEach(function (e) { w.addEventListener(e, unlock, { passive: true, capture: true }); }); } catch (e) {}
        }
        listen(window);
        try { if (window.parent && window.parent !== window) { listen(window.parent); listen(window.top); } } catch (e) {}
        try { if (navigator.userActivation && navigator.userActivation.hasBeenActive) unlock(); } catch (e) {}
        function playBeat() {
          try {
            if (actx && actx.state === 'running' && buf) {
              var src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); src.start(0);
            } else {
              el.currentTime = 0; var p = el.play(); if (p && p.catch) p.catch(function () {});
            }
          } catch (e) {}
        }

        function show(f) { ctx.drawImage(imgs[f], 0, 0, W, H); }

        var hover = false, tap = false, running = false, start = 0;
        function beat() {
          running = true; start = performance.now();
          playBeat();
          requestAnimationFrame(tick);
        }
        function tick(now) {
          var t = Math.max(0, (now - start) / 1000);
          if (t >= PERIOD) {
            if (hover || tap) { beat(); return; }
            running = false; show(0); return;
          }
          show(Math.min(NF - 1, Math.floor(t / PERIOD * NF)));
          requestAnimationFrame(tick);
        }
        function inHeart(e) {
          var r = cv.getBoundingClientRect();
          var x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
          var dx = (x - CX) / RX, dy = (y - CY) / RY;
          return dx * dx + dy * dy <= 1;
        }
        cv.addEventListener('mousemove', function (e) {
          var h = inHeart(e);
          cv.style.cursor = h ? 'pointer' : 'default';
          if (h && !hover) { hover = true; if (!running) beat(); }
          else if (!h) hover = false;
        });
        cv.addEventListener('mouseleave', function () { hover = false; });
        cv.addEventListener('touchend', function (e) {
          var t = e.changedTouches[0];
          if (t && inHeart(t)) { e.preventDefault(); tap = !tap; if (tap && !running) beat(); }
        });
      })();
      </script>
    </td>
  </tr>
