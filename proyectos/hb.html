</head>

<body>
<table border="0" align="center" bgcolor="#FFFFFF">
  <tr>
    <td align="center">
      <canvas id="hb" width="900" height="720" style="width:100%;max-width:900px;height:auto;display:block;margin:0 auto;touch-action:manipulation" role="img" aria-label="Un coraz&oacute;n que late cuando el cursor pasa por encima"></canvas>
      <p class="Estilo1">Pasa el cursor sobre el coraz&oacute;n (o toca la pantalla).</p>
      <script type="text/javascript">
      (function () {
        var cv = document.getElementById('hb'), ctx = cv.getContext('2d');
        var W = cv.width, H = cv.height;
        var CX = 480, CY = 430, RX = 290, RY = 150;   // zona del corazón
        var PERIOD = 1.04;                             // duración del latido (s)
        var REST = 2;                                  // fotograma en reposo
        var imgs = [], loaded = 0;
        for (var i = 1; i <= 5; i++) {
          var im = new Image();
          im.onload = function () { if (++loaded === 5) draw(1, REST); };
          im.src = '../imatges/hb/hb' + i + '.jpg';
          imgs.push(im);
        }
        var audio = new Audio('../imatges/hb/latido.mp3');
        audio.preload = 'auto';

        var mask = document.createElement('canvas'); mask.width = W; mask.height = H;
        var mctx = mask.getContext('2d');
        var layer = document.createElement('canvas'); layer.width = W; layer.height = H;
        var lctx = layer.getContext('2d');
        // máscara elíptica con borde suave (se calcula una sola vez)
        mctx.save(); mctx.translate(CX, CY); mctx.scale(RX, RY);
        var g = mctx.createRadialGradient(0, 0, 0.55, 0, 0, 1);
        g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        mctx.fillStyle = g; mctx.fillRect(-1, -1, 2, 2); mctx.restore();

        function pulse(t) {   // "lub" a 0,09 s y "dub" a 0,34 s, como el sonido
          function bump(c, w, a) { var d = (t - c) / w; return a * Math.exp(-d * d); }
          return 1 + bump(0.09, 0.05, 0.06) + bump(0.34, 0.05, 0.04);
        }
        function draw(scale, frame) {
          ctx.clearRect(0, 0, W, H);
          ctx.drawImage(imgs[frame], 0, 0, W, H);
          if (scale === 1) return;
          lctx.globalCompositeOperation = 'source-over';
          lctx.clearRect(0, 0, W, H);
          lctx.save();
          lctx.translate(CX, CY); lctx.scale(scale, scale); lctx.translate(-CX, -CY);
          lctx.drawImage(imgs[frame], 0, 0, W, H);
          lctx.restore();
          lctx.globalCompositeOperation = 'destination-in';
          lctx.drawImage(mask, 0, 0);
          ctx.drawImage(layer, 0, 0);
        }

        var hover = false, tap = false, running = false, start = 0;
        function beat() {
          running = true; start = performance.now();
          try { audio.currentTime = 0; var p = audio.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
          requestAnimationFrame(tick);
        }
        function tick(now) {
          var t = Math.max(0, (now - start) / 1000);
          if (t >= PERIOD) {
            if (hover || tap) { beat(); return; }
            running = false; draw(1, REST); return;
          }
          draw(pulse(t), Math.min(4, Math.floor(t / PERIOD * 5)));
          requestAnimationFrame(tick);
        }
        function inHeart(e) {
          var r = cv.getBoundingClientRect();
          var x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
          var dx = (x - CX) / (RX * 0.95), dy = (y - CY) / (RY * 0.9);
          return dx * dx + dy * dy <= 1;
        }
        cv.addEventListener('mousemove', function (e) {
          var h = inHeart(e);
          cv.style.cursor = h ? 'pointer' : 'default';
          if (h && !hover) { hover = true; if (!running) beat(); }
          else if (!h) hover = false;
        });
        cv.addEventListener('mouseleave', function () { hover = false; });
        cv.addEventListener('touchend', function (e) {
          var t = e.changedTouches[0];
          if (t && inHeart(t)) { e.preventDefault(); tap = !tap; if (tap && !running) beat(); }
        });
      })();
      </script>
    </td>
  </tr>

    <td align="center"><video width="400" controls>
